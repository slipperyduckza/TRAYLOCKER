[package]
name = "traylocker"
version = "0.1.3"
edition = "2021"
description = "A Windows system tray application that manages lock key states"
authors = ["Lee Logan"]

[dependencies]
# Windows API bindings
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Threading"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tray icons
tray-icon = "0.14"

# Images
image = "0.24"

# GUI for settings window
eframe = { version = "0.33", features = ["wgpu"] }
winit = { version = "0.30", features = ["rwh_06"] }

# Async runtime for GUI
tokio = { version = "1.0", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"

# For single instance check
single-instance = "0.3"

# For paths
dirs = "5.0"

# For casting
bytemuck = "1.4"

[build-dependencies]
embed-resource = "2.4"
svg_to_ico = "0.1.0"